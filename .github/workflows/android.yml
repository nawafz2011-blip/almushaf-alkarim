# Builds the Android app from the site: a test APK to install directly, and the bundle (AAB) for Google Play.
name: Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html, desktop.html, data.js, quran.js, "audio/**", "icons/**", "app/**", ".github/workflows/android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: gradle/actions/setup-gradle@v4

      - name: Web files and mushaf pages
        working-directory: app
        run: |
          pip install --quiet pillow
          npm ci
          python3 build-www.py
          npx cap sync android

      - name: Build the bundle
        working-directory: app/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.0.${{ github.run_number }}"
        run: ./gradlew --no-daemon bundleRelease

      - name: Test APK (installs directly, signed with a throwaway test key)
        run: |
          curl -sSLo bundletool.jar https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          keytool -genkeypair -keystore test.keystore -storepass android -keypass android -alias test \
            -dname "CN=test" -keyalg RSA -keysize 2048 -validity 10000 >/dev/null
          java -jar bundletool.jar build-apks --mode=universal \
            --bundle=app/android/app/build/outputs/bundle/release/app-release.aab --output=app.apks \
            --ks=test.keystore --ks-pass=pass:android --ks-key-alias=test --key-pass=pass:android
          unzip -o app.apks universal.apk
          mv universal.apk mushaf-test-${{ github.run_number }}.apk
          mv app/android/app/build/outputs/bundle/release/app-release.aab mushaf-${{ github.run_number }}-unsigned.aab
          ls -la *.apk *.aab

      - uses: actions/upload-artifact@v4
        with:
          name: mushaf-app-${{ github.run_number }}
          path: |
            mushaf-test-*.apk
            mushaf-*-unsigned.aab
          retention-days: 30
