# Builds the Android app from the site: a test APK to install directly, and the bundle (AAB) for Google Play.
name: Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html, desktop.html, data.js, quran.js, "audio/**", "icons/**", "app/**", ".github/workflows/android.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 1 }

      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - uses: gradle/actions/setup-gradle@v5

      - name: Web files and mushaf pages
        working-directory: app
        run: |
          pip install --quiet pillow
          npm ci
          python3 build-www.py
          npx cap sync android

      - name: Build the bundle
        working-directory: app/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.0.${{ github.run_number }}"
        # on failure, the last lines of the log become annotations, readable from the API
        run: |
          ./gradlew --no-daemon --stacktrace bundleRelease > gradle.log 2>&1 || {
            msg=$({ grep -A12 "What went wrong" gradle.log; grep -m8 "Caused by" gradle.log; grep -m5 -B2 -A3 "Where:" gradle.log; } | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=gradle::$msg"
            exit 1; }

      - name: Test APK (installs directly, signed with the test key)
        run: |
          curl -sSLo bundletool.jar https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          cp app/test.keystore test.keystore   # a fixed test key (not the Google Play key), so each test APK installs over the last
          java -jar bundletool.jar build-apks --mode=universal \
            --bundle=app/android/app/build/outputs/bundle/release/app-release.aab --output=app.apks \
            --ks=test.keystore --ks-pass=pass:android --ks-key-alias=test --key-pass=pass:android
          unzip -o app.apks universal.apk
          mv universal.apk mushaf-test-${{ github.run_number }}.apk
          mv app/android/app/build/outputs/bundle/release/app-release.aab mushaf-${{ github.run_number }}-unsigned.aab
          ls -la *.apk *.aab

      - uses: actions/upload-artifact@v5
        with:
          name: mushaf-app-${{ github.run_number }}
          path: |
            mushaf-test-*.apk
            mushaf-*-unsigned.aab
          retention-days: 30

      - name: Publish the test APK as the "app-test" release (a fixed download link)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view app-test >/dev/null 2>&1 || gh release create app-test --title "تطبيق المصحف (تجريبي)" --notes "نسخة تجريبية للتثبيت المباشر على أندرويد." --prerelease
          cp mushaf-test-*.apk mushaf-test.apk
          gh release upload app-test mushaf-test.apk mushaf-*-unsigned.aab --clobber
