<script>
// Phone and computer layouts live in two pages; a choice made with the switch button is remembered
(function () {
  var v = null; try { v = localStorage.getItem("view"); } catch (e) {}
  var want = v || (window.innerWidth >= 1000 ? "desktop" : "mobile");
  if (want === "desktop") location.replace("desktop.html" + location.hash);
})();
function switchView(to, url) {
  try { localStorage.setItem("view", to); } catch (e) {}
  location.href = url + location.hash;
}
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<style>
:root {
  --bg: #e9ede8;
  --surface: #fbfbf8;
  --ink: #1d2320;
  --muted: #5f6b64;
  --accent: #1f5e5b;
  --accent-soft: #dcebe7;
  --line: #d3dacf;
  --hover: rgba(31, 94, 91, .13);
  --sel: rgba(214, 170, 60, .30);
  --play: rgba(31, 140, 120, .30);
  --font-ui: "IBM Plex Sans Arabic", "Geeza Pro", "Segoe UI", Tahoma, sans-serif;
  --font-body: "Noto Naskh Arabic", "Geeza Pro", serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111716; --surface: #19211f; --ink: #e9e6dc; --muted: #9aa8a2;
    --accent: #6fbcb4; --accent-soft: #1f3432; --line: #2c3735;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 16px;
  touch-action: manipulation; overscroll-behavior-y: none;
}
/* The whole app is a single phone-width column, also on a computer */
.app { max-width: 520px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }

/* ---------- Top bar: search + settings ---------- */
.top {
  position: sticky; top: 0; z-index: 20; background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding: calc(8px + var(--safe-t)) 12px 8px;
  display: flex; gap: 8px; align-items: center;
}
.search { position: relative; flex: 1; min-width: 0; }
.search input {
  width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 20px; padding: 9px 16px;
}
.search input:focus { background: var(--surface); outline: none; border-color: var(--accent); }
.results {
  position: fixed; top: calc(60px + var(--safe-t)); left: 50%; transform: translateX(-50%);
  width: min(520px, 100vw); z-index: 40; background: var(--surface);
  border-bottom: 1px solid var(--line); box-shadow: 0 16px 40px -18px rgba(0,0,0,.45);
  max-height: calc(100dvh - 60px - var(--safe-t)); overflow: auto; padding: 6px 8px 16px;
}
.res-head { font-size: 13px; color: var(--muted); padding: 8px 8px 4px; }
.res { display: block; width: 100%; text-align: start; font: inherit; color: var(--ink); background: none; border: 0; border-radius: 8px; padding: 10px; cursor: pointer; }
.res:active, .res.on { background: var(--accent-soft); }
.res .rr { color: var(--accent); font-family: var(--font-body); font-size: 15px; font-weight: 600; }
.res .rt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-family: var(--font-body); font-size: 18px; line-height: 1.9; }
.res mark { background: var(--sel); color: inherit; border-radius: 3px; }
.res-empty { padding: 12px 8px; color: var(--muted); font-size: 15px; }

.round {
  flex: none; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0;
}
.round svg { width: 22px; height: 22px; }
.round:active { background: var(--accent-soft); }

/* ---------- Page ---------- */
.main { flex: 1; display: flex; justify-content: center; align-items: flex-start; padding: 8px 6px; }
.spread { display: flex; justify-content: center; touch-action: pan-y pinch-zoom; transition: opacity .15s, transform .15s; }
.spread.turn-next { opacity: 0; transform: translateX(30px); }
.spread.turn-prev { opacity: 0; transform: translateX(-30px); }
.page {
  position: relative; height: var(--ph, 600px); width: auto; flex: none; overflow: hidden;
  background: #fff; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.18), 0 10px 26px -16px rgba(0,0,0,.4);
}
.page img { position: absolute; display: block; max-width: none; height: auto; user-select: none; -webkit-user-select: none; -webkit-user-drag: none; -webkit-touch-callout: none; }
.hl { position: absolute; border-radius: 3px; cursor: pointer; }
/* zoom mode: the page is larger than the screen and the area scrolls to follow the ayah */
body.zoom .main { flex: none; display: block; height: var(--zh, 70vh); overflow: auto; padding: 8px; -webkit-overflow-scrolling: touch; }
body.zoom .spread { width: max-content; margin: 0 auto; touch-action: auto; }
.round.on { background: var(--accent); border-color: var(--accent); color: #fff; }
@media (hover: hover) { .hl.hover { background: var(--hover); } }
.hl.sel { background: var(--sel); }
.hl.play { background: var(--play); }

/* ---------- Bottom player ---------- */
.player {
  position: sticky; bottom: 0; z-index: 20; background: var(--surface);
  border-top: 1px solid var(--line); padding: 0 12px calc(10px + var(--safe-b));
}
.progress { height: 3px; background: var(--line); margin: 0 -12px; overflow: hidden; }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); }
.pinfo { display: flex; align-items: center; gap: 6px; padding: 8px 0 4px; }
.pmeta { flex: 1; min-width: 0; text-align: center; display: flex; flex-direction: column; gap: 1px; }
.ref { font-weight: 600; color: var(--accent); font-size: 16px; }
#pageLabel { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.note { font-size: 13px; color: var(--muted); }
#audioNote { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.flat { width: 38px; height: 38px; border: 0; background: none; color: var(--muted); }
.pctrl { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.pbtn {
  flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px;
  font: inherit; font-size: 11px; color: var(--muted); background: none; border: 0; padding: 4px 2px; min-width: 52px; cursor: pointer;
}
.pbtn svg { width: 24px; height: 24px; color: var(--ink); }
.pbtn.on, .pbtn.on svg { color: var(--accent); }
.play-main {
  flex: none; width: 62px; height: 62px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--accent); color: var(--surface); display: grid; place-items: center;
  box-shadow: 0 6px 16px -8px var(--accent);
}
.play-main svg { width: 28px; height: 28px; }
.play-main:active { transform: scale(.96); }
.skip { width: 46px; height: 46px; border: 0; background: none; color: var(--ink); }
.skip svg { width: 26px; height: 26px; }

/* ---------- Bottom sheets (settings, tafsir) and the repeat dialog ---------- */
.modal {
  position: fixed; inset: 0; z-index: 50; background: rgba(10, 20, 18, .45);
  display: flex; align-items: flex-end; justify-content: center;
}
.dialog {
  background: var(--surface); color: var(--ink); width: min(520px, 100%);
  max-height: 88dvh; overflow: auto; border-radius: 18px 18px 0 0;
  padding: 8px 18px calc(18px + var(--safe-b)); display: flex; flex-direction: column; gap: 14px;
  box-shadow: 0 -10px 40px -20px rgba(0,0,0,.5); animation: up .2s ease-out;
}
@keyframes up { from { transform: translateY(40px); opacity: .4; } }
.dialog::before { content: ""; align-self: center; width: 40px; height: 4px; border-radius: 2px; background: var(--line); flex: none; }
.dialog-head { display: flex; align-items: center; justify-content: space-between; }
.dialog-head h2 { margin: 0; font-family: var(--font-body); font-size: 20px; color: var(--accent); }
.icon-btn { font: inherit; font-size: 18px; background: none; border: 0; color: var(--muted); cursor: pointer; padding: 6px 10px; border-radius: 8px; }
.icon-btn:active { background: var(--accent-soft); }

.field { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--muted); }
.field.inline { flex-direction: row; align-items: center; gap: 10px; color: var(--ink); font-size: 16px; }
select, input[type=number] {
  font: inherit; font-size: 16px; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%;
}
input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.btn {
  font: inherit; font-size: 16px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 11px 18px; cursor: pointer;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn:disabled { opacity: .45; cursor: default; }

.dialog fieldset { border: 1px solid var(--line); border-radius: 10px; margin: 0; padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 10px; }
.dialog legend { padding: 0 6px; font-weight: 600; color: var(--accent); font-size: 15px; }
.range-row { display: grid; grid-template-columns: auto 1fr 90px; align-items: end; gap: 8px; }
.range-tag { text-align: center; font-weight: 600; background: var(--accent-soft); color: var(--accent); border-radius: 8px; padding: 10px; }
.dialog-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.tafsir { font-family: var(--font-body); font-size: 18px; line-height: 2; display: flex; flex-direction: column; gap: 8px; }
.tf { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; cursor: pointer; }
.tf.cur { background: var(--accent-soft); border-color: var(--accent); }
.tn { color: var(--accent); font-family: var(--font-ui); font-size: 15px; margin-inline-end: 6px; white-space: nowrap; }
.tf-surah { text-align: center; color: var(--accent); font-weight: 600; font-family: var(--font-ui); padding-block: 2px; }

/* Tajweed color key (shown only for the color-coded mushaf) */
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; font-size: 14px; line-height: 1.5; }
.legend .lg-head { grid-column: 1 / -1; font-size: 13px; color: var(--muted); margin-top: 2px; }
.legend span { display: flex; align-items: center; gap: 7px; }
.legend i { width: 14px; height: 14px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
.legend b { font-weight: 600; }
.label { font-size: 13px; color: var(--muted); }

[hidden] { display: none !important; }
</style>
</head>

<script>
const RECITERS = [
  ["Minshawy_Murattal_128kbps", "محمد صديق المنشاوي (مرتل)"],
  ["Minshawy_Mujawwad_64kbps", "محمد صديق المنشاوي (مجوّد)"],
  ["Husary_64kbps", "محمود خليل الحصري (مرتل)"],

/* ---------- Mushafs: page scans, their grid size and highlight layout ---------- */
const BODY_A = { h: 30, mg: 40, tw: 416, ow: 10, oh: 15, fs: 117, top: 44, stop: 80 };
const BODY_B = { h: 40, mg: 25, tw: 427, ow: 17, oh: 20, fs: 140, top: 30, stop: 80 };
// All page geometry is in "units": the page image is 456 units wide and H units tall.
// PDF mushafs share the Madinah layout, so hafs coordinates are mapped onto them by a scale +
// offset [sx, bx, sy, by] measured for every page (MUSHAF_T in the data file), because the
// text block sits at a different place on different PDF pages. The decorated opening pages
// (1–2) have their own hand-fitted mapping.
// crop: [x0, x1, y0, y1] trims the white margin on the binding side so facing pages sit together;
// it follows the page's own text block, keeping room for the frame around it.
const HAFS_TEXT = [49, 406];   // left/right edge of the text block on the hafs scans
const FRAME_ROOM = 32;         // frame width beyond the text block, in units
const pdfMushaf = (key, name, pageH, open, inner, top, bottom) => ({
  name, ext: "jpg", coords: "hafs", warsh: false,
  H: p => 456 * pageH(p) / 562,
  T: p => p <= 2 ? open[p - 1] : MUSHAF_T[key][p - 1],
  crop: (p, H) => {
    if (p === 1) return [inner[0], 456, 0, H];
    if (p === 2) return [0, inner[1], 0, H];
    const [sx, bx] = MUSHAF_T[key][p - 1];
    return p % 2
      ? [Math.max(0, sx * HAFS_TEXT[0] + bx - FRAME_ROOM), 456, top(p), bottom(p)]
      : [0, Math.min(456, sx * HAFS_TEXT[1] + bx + FRAME_ROOM), top(p), bottom(p)];
  },
});
const MUSHAFS = {
  hafs:      { name: "حفص عن عاصم (مصحف المدينة)", ext: "png", H: () => 672, M: BODY_A, F: { h: 20, mg: 80, tw: 376, ow: 5, oh: 10 }, warsh: false },
  standard1: pdfMushaf("standard1", "مصحف المدينة · إطار أخضر", p => p <= 61 ? 882 : 804,
               [[0.97, -39, 0.96, -4], [0.97, 51, 0.96, -3]], [25, 408], p => p <= 61 ? 44 : 12, p => p <= 61 ? 662 : 630),
  standard2: pdfMushaf("standard2", "مصحف المدينة · إطار أزرق", () => 804,
               [[0.97, -39, 0.99, -47], [0.97, 51, 0.99, -42]], [22, 414], () => 6, () => 615),
  big:       pdfMushaf("big", "مصحف المدينة · خط كبير", () => 806,
               [[0.8, 43, 0.8, 26], [0.8, 41, 0.8, 24]], [24, 433], () => 38, () => 616),
  tajweed:   { name: "مصحف التجويد الملوّن", ext: "png", H: () => 707, M: BODY_B, F: { h: 30, mg: 100, tw: 350, ow: 10, oh: 15 }, warsh: false },
  warsh:     { name: "ورش عن نافع",         ext: "png", H: () => 739, M: BODY_B, F: { h: 20, mg: 80, tw: 376, ow: 5, oh: 10 }, warsh: true },
};
const coordsOf = m => MUSHAFS[m].coords || m;
// Visible part of page p, in units: { H, crop: [x0, x1, y0, y1] }
function frameOf(p) {
  const mz = MZ(), H = mz.H(p);
  return { H, crop: mz.crop ? mz.crop(p, H) : [0, 456, 0, H] };
}
const OPEN_CIRCLE = { cx: 228, cy: 381, r: 108 };   // text circle of Al-Fatiha / opening of Al-Baqarah, in hafs units

/* ---------- Index ---------- */
// AY[i] = { s, a } in mushaf order (the same order in all three mushafs)
const AY = [], surahFirst = [];
MUSHAF_PAGES.hafs.forEach(list => list.forEach(([k]) => {
  const [s, a] = k.split("_").map(Number);
  if (a === 1) surahFirst[s] = AY.length;
  AY.push({ s, a });
}));
// Per mushaf: page of each ayah, first ayah of each page, first page of each juz
const IDX = {};
for (const m in MUSHAF_PAGES) {
  const pageOf = [], first = [], juzFirst = [];
  let i = 0;
  MUSHAF_PAGES[m].forEach((list, pi) => {
    first[pi] = i;
    list.forEach(() => {
      pageOf[i] = pi + 1;
      if (!juzFirst[JUZ[i]]) juzFirst[JUZ[i]] = pi + 1;
      i++;
    });
  });
  IDX[m] = { pageOf, first, juzFirst };
}
const idxOf = (s, a) => (surahFirst[s] !== undefined && a >= 1 && a <= SURAHS[s - 1][1]) ? surahFirst[s] + a - 1 : -1;

let mushaf = MUSHAFS[store.get("mushaf")] ? store.get("mushaf") : "hafs";
const MZ = () => MUSHAFS[mushaf];
const X = () => IDX[coordsOf(mushaf)];

/* ---------- Highlight geometry (ayah-end points → line boxes) ---------- */
// Returns, per ayah on the page, boxes in page units: [top, left, width, height]
function rectsFor(page) {
  const mz = MZ(), cm = coordsOf(mushaf);
  let raw = rectsRaw(MUSHAFS[cm], MUSHAF_PAGES[cm][page - 1], page);
  if (page <= 2 && cm === "hafs") raw = clampToCircle(raw);
  if (!mz.T) return raw;
  const [sx, bx, sy, by] = mz.T(page);
  return raw.map(rs => rs.map(([y, x, w, h]) => [sy * y + by, sx * x + bx, sx * w, sy * h]));
}
// Keep opening-page boxes inside the round text frame
function clampToCircle(raw) {
  const { cx, cy, r } = OPEN_CIRCLE;
  return raw.map(rs => rs.map(([t, l, w, h]) => {
    const dy = t + h / 2 - cy, hw = Math.sqrt(Math.max(0, r * r - dy * dy));
    const L = Math.max(l, cx - hw), R = Math.min(l + w, cx + hw);
    return [t, L, R - L, h];
  }));
}
function rectsRaw(mz, list, page) {
  const M = page <= 2 ? { ...mz.M, ...mz.F } : mz.M;
  const out = [];
  let pt = null, pl = null;
  list.forEach(([k, x, y], n) => {
    const a = +k.split("_")[1];
    const top = y - M.oh, left = x - M.ow, r = [];
    // on the opening pages the first ayah starts on its own line (the basmala line of Al-Baqarah is not an ayah)
    if (n === 0) { pl = M.tw; pt = page <= 2 ? top : (a === 1 ? M.stop : M.top); }
    else if (a === 1) { pt += M.fs; pl = M.tw; }
    const diff = top - pt;
    if (diff > M.h * 1.6) {
      r.push([pt, M.mg, pl - M.mg, M.h], [top, left, M.tw - left, M.h], [pt + M.h, M.mg, M.tw - M.mg, diff - M.h]);
    } else if (diff > M.h * 0.6) {
      r.push([pt, M.mg, pl - M.mg, M.h], [top, left, M.tw - left, M.h]);
    } else {
      r.push([top, left, pl - left, M.h]);
    }
    out.push(r);
    pt = top; pl = left;
  });
  return out;
}

/* ---------- Page images: local folder, or Google Drive when running in Apps Script ---------- */
const inAppsScript = !!(window.google && google.script && google.script.run);
const imgCache = {};
function pageSrc(m, p) {
  if (!inAppsScript) return Promise.resolve(`pages/${m}/${p}.${MUSHAFS[m].ext}`);
  const k = m + "/" + p;
  if (!imgCache[k]) {
    imgCache[k] = new Promise((ok, fail) =>
      google.script.run.withSuccessHandler(ok).withFailureHandler(e => { delete imgCache[k]; fail(e); }).getPage(m, p));
  }

}

/* ---------- Rendering ---------- */
// paused: stopped mid-ayah by the user; pressing play carries on from the same spot
let page = 1, cur = -1, playing = false, paused = false, playIdx = -1;
const twoUp = () => false;   // phone layout: always one page
let zoomOn = false;   // zoom mode is only in the computer layout
const ZOOM = 1.7;
const zoomBox = () => document.querySelector(".main");

const ratioOf = p => { const [x0, x1, y0, y1] = frameOf(p).crop; return (x1 - x0) / (y1 - y0); };
// The page fills the screen width, and shrinks only if it would not fit between the top bar and the player
function sizePages() {
  const ratio = ratioOf(page);
  const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  const chrome = $("searchBox").parentNode.offsetHeight + $("player").offsetHeight + 16;
  const availH = Math.max(300, vh - chrome);
  const availW = Math.min(window.innerWidth, 520) - 12;
  document.documentElement.style.setProperty("--zh", Math.floor(availH) + "px");
  document.documentElement.style.setProperty("--ph", Math.floor(zoomOn ? availW * ZOOM / ratio : Math.min(availH, availW / ratio)) + "px");
}

function pageEl(p) {
  const div = document.createElement("div");
  div.className = "page";
  const [x0, x1, y0, y1] = frameOf(p).crop, cw = x1 - x0, ch = y1 - y0;
  div.style.aspectRatio = cw + " / " + ch;
  const img = document.createElement("img");
  img.alt = "صفحة " + ar(p);
  img.style.cssText = `width:${456 / cw * 100}%;left:${-x0 / cw * 100}%;top:${-y0 / ch * 100}%`;
  div.appendChild(img);
  const m = mushaf;
  pageSrc(m, p).then(src => { if (m === mushaf) img.src = src; })
    .catch(() => { div.insertAdjacentHTML("beforeend", '<div class="note" style="position:absolute;inset:40% 10% auto;text-align:center">تعذّر تحميل الصفحة. تأكد من مجلد الصفحات في قوقل درايف.</div>'); });
  const first = X().first[p - 1];
  rectsFor(p).forEach((rs, n) => rs.forEach(([t, l, w, h]) => {
    if (w <= 0 || h <= 0) return;
    const d = document.createElement("div");
    d.className = "hl"; d.dataset.i = first + n;
    d.style.cssText = `top:${(t - y0) / ch * 100}%;left:${(l - x0) / cw * 100}%;width:${w / cw * 100}%;height:${h / ch * 100}%`;
    div.appendChild(d);
  }));
  return div;
}

function shownPages() {
  if (!twoUp()) return [page];
  const r = page % 2 ? page : page - 1;   // odd pages sit on the right
  return r < 604 ? [r, r + 1] : [r];
}

function render(p) {
  page = Math.min(604, Math.max(1, p));
  sizePages();
  const sp = $("spread"), ps = shownPages();
  sp.innerHTML = "";
  ps.forEach(q => sp.appendChild(pageEl(q)));
  const fi = X().first[page - 1];
  $("pageLabel").textContent = "صفحة " + ar(page) + " · الجزء " + ar(JUZ[fi]);
  $("pageInput").value = page;
  $("surahSel").value = AY[fi].s;
  $("juzSel").value = JUZ[fi];
  paint();
  renderTafsir();
  // warm the next pages so turning is instant
  const nx = ps[ps.length - 1] + 1;
  [nx, nx + 1].filter(q => q <= 604).forEach(q => pageSrc(mushaf, q).then(src => { new Image().src = src; }).catch(() => {}));
}

/* ---------- Tafsir list for the pages on screen ---------- */
// Online source is keyed by Madinah (hafs) pages, so fetch those pages and map back by ayah index
const tafsirByHafsPage = {};
function hafsPageTafsir(hp) {
  if (!tafsirByHafsPage[hp]) {
    tafsirByHafsPage[hp] = fetch("https:\/\/api.alquran.cloud/v1/page/" + hp + "/ar.muyassar")
      .then(r => r.json()).then(j => j.data.ayahs.map(a => a.text))
      .catch(e => { delete tafsirByHafsPage[hp]; throw e; });
  }
  return tafsirByHafsPage[hp];
}
function tafsirFor(indices) {
  if (window.TAFSIR) return Promise.resolve(indices.map(i => TAFSIR[i]));
  const hp = [...new Set(indices.map(i => IDX.hafs.pageOf[i]))];
  return Promise.all(hp.map(hafsPageTafsir)).then(lists => {
    const map = {};
    hp.forEach((q, k) => lists[k].forEach((t, n) => { map[IDX.hafs.first[q - 1] + n] = t; }));
    return indices.map(i => map[i]);
  });
}
let tafsirToken = 0;
function renderTafsir() {
  const token = ++tafsirToken, box = $("tafsir");
  const indices = [];
  shownPages().forEach(p => {
    const f = X().first[p - 1], n = MUSHAF_PAGES[coordsOf(mushaf)][p - 1].length;
    for (let k = 0; k < n; k++) indices.push(f + k);
  });
  box.innerHTML = '<div class="note">جارٍ تحميل التفسير…</div>';
  tafsirFor(indices).then(texts => {
    if (token !== tafsirToken) return;
    box.innerHTML = indices.map((i, k) => {
      const o = AY[i];
      return (o.a === 1 ? `<div class="tf-surah">سورة ${SURAHS[o.s - 1][0]}</div>` : "") +
        `<div class="tf" data-i="${i}"><span class="tn">( ${ar(o.a)} )</span>${texts[k]}</div>`;
    }).join("");
    markTafsir(true);
  }).catch(() => {
    if (token === tafsirToken) box.innerHTML = '<div class="note">تعذّر تحميل التفسير. تأكد من اتصال الإنترنت.</div>';
  });
}
function markTafsir(scroll) {
  const box = $("tafsir");
  box.querySelectorAll(".tf").forEach(d => d.classList.toggle("cur", +d.dataset.i === cur));
  const el = box.querySelector(".tf.cur");
  if (el && scroll && !$("tafsirModal").hidden) el.scrollIntoView({ block: "center" });
}
$("tafsir").addEventListener("click", e => {
  const d = e.target.closest(".tf"); if (!d) return;
  const i = +d.dataset.i;
  playing ? playAyah(i) : select(i);
});

function paint() {
  document.querySelectorAll(".hl").forEach(d => {
    const i = +d.dataset.i;
    const active = (playing || paused) && i === playIdx;
    d.classList.toggle("sel", i === cur && !active);
    d.classList.toggle("play", active);

const onPage = i => shownPages().includes(X().pageOf[i]);

function select(i) {

  const o = AY[i];
  $("ref").textContent = "سورة " + SURAHS[o.s - 1][0] + " · الآية " + ar(o.a);

/* ---------- Audio ---------- */
const audio = $("audio"), pre = $("preload");
let inBasmala = false, waitTimer = 0, pendingWait = null;   // pendingWait: step still due when paused during a wait
const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="3.6" height="14" rx="1"/><rect x="13.9" y="5" width="3.6" height="14" rx="1"/></svg>';
function setPlayBtn() {
  $("playBtn").innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
  $("playBtn").setAttribute("aria-label", playing ? "إيقاف مؤقت" : paused ? "متابعة" : "تشغيل");
  if ("mediaSession" in navigator) navigator.mediaSession.playbackState = playing ? "playing" : paused ? "paused" : "none";
}
// Repeat session started from the repeat dialog; null while playing normally.
// Counts are totals (1 = play once); Infinity means "until stopped".
let session = null;   // { from, to, ayahTimes, wait, passTimes, ayahLeft, passLeft }
const reciters = () => MZ().warsh ? RECITERS_WARSH : RECITERS;
const rec = () => $("reciterSel").value;
const pad = n => String(n).padStart(3, "0");
const urlFor = (s, a) => AUDIO_BASE + rec() + "/" + pad(s) + pad(a) + ".mp3";
const needsBasmala = o => o.a === 1 && o.s !== 1 && o.s !== 9;

const refText = i => SURAHS[AY[i].s - 1][0] + " " + ar(AY[i].a);
const times = n => n === Infinity ? "بلا توقف" : ar(n);

function updateNote(waiting) {
  let t = "القارئ: " + $("reciterSel").selectedOptions[0].text;
  if (session) {
    const s = session;
    t += "\nتكرار من " + refText(s.from) + " إلى " + refText(s.to);
    if (s.ayahTimes > 1) t += " · الآية: " + (s.ayahTimes === Infinity ? "بلا توقف" : ar(s.ayahTimes - s.ayahLeft) + " من " + ar(s.ayahTimes));
    if (s.passTimes > 1) t += " · الفقرة: " + (s.passTimes === Infinity ? "بلا توقف" : ar(s.passTimes - s.passLeft) + " من " + ar(s.passTimes));
    if (waiting) t += "\nانتظار…";
  }
  if (paused) t = "متوقف مؤقتًا · " + t;
  $("audioNote").textContent = t;
  // keep the line's space so the page does not jump when recitation starts
  $("audioNote").style.visibility = (playing || paused || session) ? "visible" : "hidden";
}

function playAyah(i, fresh = true) {
  if (i < 0 || i >= AY.length) { stop(); return; }
  clearTimeout(waitTimer); pendingWait = null; paused = false;
  if (session && (i < session.from || i > session.to)) endSession();   // jumped outside the range
  playIdx = i; playing = true;
  if (fresh && session) session.ayahLeft = session.ayahTimes - 1;
  select(i);
  const o = AY[i];
  inBasmala = needsBasmala(o) && fresh;
  audio.src = inBasmala ? urlFor(1, 1) : urlFor(o.s, o.a);
  audio.play().catch(() => {});
  if (i + 1 < AY.length) { const n = AY[i + 1]; pre.src = urlFor(n.s, n.a); }
  setPlayBtn();
  updateNote();
  paint();
}

function endSession() {
  session = null;
  $("repStop").disabled = true;
  $("repeatBtn").classList.remove("on");
}

function stop() {
  clearTimeout(waitTimer); pendingWait = null;
  endSession();
  playing = false; paused = false; audio.pause();
  setPlayBtn();
  $("prog").style.width = "0";
  updateNote();
  paint();
}

// Pause keeps the ayah, its position and any repeat session, so play continues from the same spot
function pause() {
  if (!playing) return;
  playing = false; paused = true;
  clearTimeout(waitTimer);
  audio.pause();
  setPlayBtn(); updateNote(); paint();
}
function resume() {
  if (!paused) return;
  playing = true; paused = false;
  setPlayBtn(); updateNote(); paint();
  if (pendingWait) { const fn = pendingWait; pendingWait = null; fn(); }
  else audio.play().catch(() => {});
}

// Waits between recitations as set in the dialog: fixed seconds, or a multiple of the ayah's length
function afterWait(fn) {
  const w = session.wait, ms = w >= 0 ? w * 1000 : -w * (audio.duration || 0) * 1000;
  if (ms <= 0) return fn();
  updateNote(true);
  pendingWait = fn;
  waitTimer = setTimeout(() => { if (playing) { pendingWait = null; fn(); } }, ms);
}

// Paused from outside the page (headphones taken out, a phone call): treat it like the pause button
audio.addEventListener("pause", () => {
  if (playing && !audio.ended && audio.readyState >= 3 && audio.currentTime > 0) pause();
});
audio.addEventListener("timeupdate", () => {
  if (audio.duration) $("prog").style.width = (audio.currentTime / audio.duration * 100) + "%";
});
audio.addEventListener("ended", () => {
  if (!playing) return;
  if (inBasmala) { inBasmala = false; const o = AY[playIdx]; audio.src = urlFor(o.s, o.a); audio.play().catch(() => {}); return; }
  if (session) {
    const s = session;
    if (s.ayahLeft > 0) {
      s.ayahLeft--;
      return afterWait(() => { audio.currentTime = 0; audio.play().catch(() => {}); updateNote(); });
    }
    if (playIdx < s.to) return afterWait(() => playAyah(playIdx + 1));
    if (s.passLeft > 0) { s.passLeft--; return afterWait(() => playAyah(s.from)); }
    return stop();
  }
  if ($("autoNext").checked && playIdx + 1 < AY.length) playAyah(playIdx + 1);
  else stop();
});

/* ---------- Repeat dialog ---------- */
function fillAyahs(sel, s, a) {
  const n = SURAHS[s - 1][1];
  sel.innerHTML = Array.from({ length: n }, (_, k) => `<option value="${k + 1}">${ar(k + 1)}</option>`).join("");
  sel.value = Math.min(Math.max(1, a), n);
}
function openRepeat() {
  const i = cur >= 0 ? cur : X().first[page - 1], s = session;
  const from = s ? s.from : i, to = s ? s.to : i;
  $("repFromS").value = AY[from].s; fillAyahs($("repFromA"), AY[from].s, AY[from].a);
  $("repToS").value = AY[to].s; fillAyahs($("repToA"), AY[to].s, AY[to].a);
  try {
    const saved = JSON.parse(store.get("repeat") || "{}");
    ["repAyah", "repWait", "repPass"].forEach(id => { if (saved[id] != null) $(id).value = saved[id]; });
  } catch (e) {}
  $("repStop").disabled = !session;
  $("repeatModal").hidden = false;
  $("repStart").focus();
}
const closeRepeat = () => { $("repeatModal").hidden = true; $("repeatBtn").focus(); };
const countOf = v => +v === 0 ? Infinity : +v;
$("repFromS").onchange = e => fillAyahs($("repFromA"), +e.target.value, 1);
$("repToS").onchange = e => fillAyahs($("repToA"), +e.target.value, SURAHS[+e.target.value - 1][1]);
$("repeatBtn").onclick = openRepeat;
$("repeatClose").onclick = closeRepeat;
$("repeatModal").addEventListener("click", e => { if (e.target.id === "repeatModal") closeRepeat(); });
$("repeatModal").addEventListener("keydown", e => { if (e.key === "Escape") closeRepeat(); e.stopPropagation(); });
$("repStart").onclick = () => {
  let from = idxOf(+$("repFromS").value, +$("repFromA").value), to = idxOf(+$("repToS").value, +$("repToA").value);
  if (to < from) [from, to] = [to, from];
  store.set("repeat", JSON.stringify({ repAyah: $("repAyah").value, repWait: $("repWait").value, repPass: $("repPass").value }));
  const ayahTimes = countOf($("repAyah").value), passTimes = countOf($("repPass").value);
  session = { from, to, ayahTimes, wait: +$("repWait").value, passTimes, ayahLeft: ayahTimes - 1, passLeft: passTimes - 1 };
  $("repeatBtn").classList.add("on");
  closeRepeat();
  playAyah(from);
};
$("repStop").onclick = () => { stop(); closeRepeat(); };
audio.addEventListener("error", () => {
  if (!playing) return;
  stop();
  $("audioNote").textContent = "تعذّر تشغيل التلاوة. تأكد من اتصال الإنترنت أو جرّب قارئًا آخر.";
});

/* ---------- Controls ---------- */
function fillReciters() {
  const list = reciters(), key = MZ().warsh ? "reciterWarsh" : "reciter", saved = store.get(key);
  $("reciterSel").innerHTML = list.map(r => `<option value="${r[0]}">${r[1]}</option>`).join("");
  if (saved && list.some(r => r[0] === saved)) $("reciterSel").value = saved;
}
function fill() {
  $("mushafSel").innerHTML = Object.entries(MUSHAFS).map(([k, v]) => `<option value="${k}">${v.name}</option>`).join("");
  $("mushafSel").value = mushaf;
  const surahOpts = SURAHS.map((s, i) => `<option value="${i + 1}">${ar(i + 1)}. ${s[0]}</option>`).join("");
  ["surahSel", "repFromS", "repToS"].forEach(id => { $(id).innerHTML = surahOpts; });
  $("juzSel").innerHTML = Array.from({ length: 30 }, (_, i) => `<option value="${i + 1}">${ar(i + 1)}</option>`).join("");
  fillReciters();
  showKey();
}
const showKey = () => { $("tajweedKey").hidden = mushaf !== "tajweed"; };

/* ---------- Bottom sheets ---------- */
function openSheet(id) { $(id).hidden = false; }
function closeSheets() { ["settingsModal", "tafsirModal"].forEach(id => { $(id).hidden = true; }); }
["settingsModal", "tafsirModal"].forEach(id => {
  $(id).addEventListener("click", e => { if (e.target.id === id || e.target.closest("[data-close]")) closeSheets(); });
  $(id).addEventListener("keydown", e => { if (e.key === "Escape") closeSheets(); e.stopPropagation(); });
});
$("settingsBtn").onclick = () => openSheet("settingsModal");
$("tafsirBtn").onclick = () => { openSheet("tafsirModal"); markTafsir(true); };
// choosing a surah, juz or page takes you straight to it
["surahSel", "juzSel", "mushafSel"].forEach(id => $(id).addEventListener("change", closeSheets));
$("pageInput").addEventListener("change", () => { $("pageInput").blur(); closeSheets(); });

/* ---------- Swipe to turn pages (like a mushaf: swipe right for the next page) ---------- */
let tx = 0, ty = 0, tt = 0, multi = false;
$("spread").addEventListener("touchstart", e => {
  multi = e.touches.length > 1;
  const t = e.touches[0]; tx = t.clientX; ty = t.clientY; tt = Date.now();
}, { passive: true });
$("spread").addEventListener("touchend", e => {
  if (zoomOn || multi || (window.visualViewport && window.visualViewport.scale > 1.05)) return;   // panning or pinch-zooming, not turning
  const t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
  if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.5 || Date.now() - tt > 700) return;
  turn(dx > 0 ? 1 : -1);
});
function turn(dir) {
  const to = page + dir;
  if (to < 1 || to > 604) return;
  const sp = $("spread");
  sp.classList.add(dir > 0 ? "turn-next" : "turn-prev");
  setTimeout(() => { render(to); sp.classList.remove("turn-next", "turn-prev"); }, 140);
}

/* ---------- Lock-screen / headphone controls ---------- */
function setMediaInfo() {
  if (!("mediaSession" in navigator) || cur < 0) return;
  const o = AY[playing || paused ? playIdx : cur];
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: "سورة " + SURAHS[o.s - 1][0] + " · الآية " + ar(o.a),
      artist: $("reciterSel").selectedOptions[0] ? $("reciterSel").selectedOptions[0].text : "",
      album: "القرآن الكريم",
    });
  } catch (e) {}
}
if ("mediaSession" in navigator) {
  const ms = navigator.mediaSession, on = (a, f) => { try { ms.setActionHandler(a, f); } catch (e) {} };
  on("play", () => { if (paused) resume(); else if (!playing) $("playBtn").click(); });
  on("pause", pause);
  on("nexttrack", () => $("nextAyah").click());
  on("previoustrack", () => $("prevAyah").click());
}

/* ---------- Zoom mode: a bigger page that scrolls to follow the ayah being read ---------- */
function follow(smooth) {
  if (!zoomOn) return;
  const box = zoomBox(), el = document.querySelector(".hl.play") || document.querySelector(".hl.sel");
  if (!box) return;
  if (!el) { box.scrollTo({ top: 0, left: 0 }); return; }
  const r = el.getBoundingClientRect(), b = box.getBoundingClientRect();
  box.scrollTo({
    left: box.scrollLeft + (r.left + r.width / 2) - (b.left + b.width / 2),
    top: box.scrollTop + (r.top - b.top) - b.height / 3,
    behavior: smooth ? "smooth" : "auto",
  });
}
function setZoom(on) {
  zoomOn = on;
  store.set("zoom", on ? "1" : "0");
  document.body.classList.toggle("zoom", on);
  $("zoomBtn").classList.toggle("on", on);
  $("zoomBtn").setAttribute("aria-pressed", on);
  render(page);
  requestAnimationFrame(() => follow(false));
}


const spread = $("spread");
spread.addEventListener("mouseover", e => {
  const d = e.target.closest(".hl"); if (!d) return;
  document.querySelectorAll(`.hl[data-i="${d.dataset.i}"]`).forEach(x => x.classList.add("hover"));
});
spread.addEventListener("mouseout", e => {
  const d = e.target.closest(".hl"); if (!d) return;
  document.querySelectorAll(`.hl[data-i="${d.dataset.i}"]`).forEach(x => x.classList.remove("hover"));
});
spread.addEventListener("click", e => {
  const d = e.target.closest(".hl"); if (!d) return;
  const i = +d.dataset.i;
  playing ? playAyah(i) : select(i);
});

const step = () => twoUp() ? 2 : 1;
const base = () => shownPages()[0];
$("nextPage").onclick = () => turn(1);
$("prevPage").onclick = () => turn(-1);
$("playBtn").onclick = () => {
  if (playing) pause();
  else if (paused && cur === playIdx) resume();          // same ayah: carry on from where it stopped
  else playAyah(cur < 0 ? X().first[page - 1] : cur);    // another ayah was chosen: start it
};
$("nextAyah").onclick = () => { const i = Math.min(AY.length - 1, cur + 1); playing ? playAyah(i) : select(i); };
$("prevAyah").onclick = () => { const i = Math.max(0, cur - 1); playing ? playAyah(i) : select(i); };
$("pageInput").onchange = e => { const v = parseInt(e.target.value, 10); if (v >= 1 && v <= 604) render(v); };
$("surahSel").onchange = e => { const i = surahFirst[+e.target.value]; if (playing) playAyah(i); else select(i); };
$("juzSel").onchange = e => render(X().juzFirst[+e.target.value]);
$("reciterSel").onchange = () => { store.set(MZ().warsh ? "reciterWarsh" : "reciter", rec()); if (playing) playAyah(playIdx); else if (paused) stop(); };
$("mushafSel").onchange = e => {
  const wasWarsh = MZ().warsh;
  if (playing) stop();
  mushaf = e.target.value;
  store.set("mushaf", mushaf);
  showKey();
  if (MZ().warsh !== wasWarsh) fillReciters();
  const i = cur >= 0 ? cur : X().first[page - 1];
  render(X().pageOf[i]);
  select(i);
};
document.addEventListener("keydown", e => {
  if (e.target.matches("input, select")) return;
  if (e.key === "ArrowLeft") $("nextPage").click();
  else if (e.key === "ArrowRight") $("prevPage").click();
  else if (e.key === " ") { e.preventDefault(); $("playBtn").click(); }
});
let rz, lastW = window.innerWidth;
// Re-layout on rotation, but not when the phone keyboard opens (that only changes the height)
window.addEventListener("resize", () => {
  clearTimeout(rz);
  rz = setTimeout(() => { if (window.innerWidth !== lastW || !document.activeElement.matches("input")) { lastW = window.innerWidth; render(page); } }, 150);
});

/* ---------- Search: surahs by name, ayahs by text ---------- */
// Letters are compared without diacritics, and alef/yaa/taa-marbuta variants count as one
const norm = t => t.replace(/[ؐ-ًؚ-ٰٟۖ-ۭـ]/g, "")
  .replace(/[أإآٱ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه").replace(/ؤ/g, "و").replace(/ئ/g, "ي")
  .replace(/\s+/g, " ").trim();
const SURAH_N = SURAHS.map(x => norm(x[0]));
let quranN = null, quranLoad = null;
function loadQuran() {
  if (!quranLoad) quranLoad = new Promise((ok, fail) => {
    const sc = document.createElement("script");
    sc.src = "quran.js";
    sc.onload = () => { quranN = AY.map(o => norm(QURAN[o.s - 1][o.a - 1])); ok(); };
    sc.onerror = () => { quranLoad = null; fail(); };
    document.head.appendChild(sc);
  });
  return quranLoad;
}
const esc = t => t.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
// Mark the query inside the original (voweled) text: map normalized positions back to it
function markIn(text, q) {
  const keep = [], chars = [];
  for (let k = 0; k < text.length; k++) {
    const n = /\s/.test(text[k]) ? " " : norm(text[k]);
    if (n) { chars.push(n); keep.push(k); }
  }
  const flat = chars.join(""), at = flat.indexOf(q);
  if (at < 0) return esc(text);
  const a = keep[at], endK = keep[at + q.length - 1];
  let b = endK + 1;
  while (b < text.length && !norm(text[b])) b++;   // keep the last letter's vowels inside the mark
  return esc(text.slice(0, a)) + "<mark>" + esc(text.slice(a, b)) + "</mark>" + esc(text.slice(b));
}
const sBox = $("searchResults"), sIn = $("searchInput");
let sItems = [], sOn = -1;
function goTo(i) {
  sBox.hidden = true; sIn.blur();
  playing ? playAyah(i) : select(i);
}
function showResults(html) { sBox.innerHTML = html; sBox.hidden = false; sOn = -1; sItems = [...sBox.querySelectorAll(".res")]; }
function runSearch() {
  const raw = sIn.value.trim();
  if (!raw) { sBox.hidden = true; return; }
  let html = "";
  // "2:255", "2 255" or a surah number jump straight to it
  const ref = /^(\d{1,3})(?:\s*[:\s\-/]\s*(\d{1,3}))?$/.exec(raw.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)));
  if (ref) {
    const s = +ref[1], a = ref[2] ? +ref[2] : 1, i = idxOf(s, a);
    if (i >= 0) html += `<button class="res" data-i="${i}"><span class="rr">سورة ${SURAHS[s - 1][0]}${ref[2] ? " · الآية " + ar(a) : ""}</span></button>`;
  }
  const q = norm(raw).replace(/^سوره\s+/, "");
  if (q) {
    const ss = [];
    SURAH_N.forEach((n, k) => { if (n.includes(q) || n.replace(/^ال/, "").startsWith(q)) ss.push(k); });
    if (ss.length) html += `<div class="res-head">السور</div>` + ss.slice(0, 8).map(k =>
      `<button class="res" data-i="${surahFirst[k + 1]}"><span class="rr">${ar(k + 1)}. سورة ${SURAHS[k][0]}</span> <span class="note">· ${ar(SURAHS[k][1])} آية</span></button>`).join("");
  }
  if (q.length >= 2 && quranN) {
    const hits = [];
    for (let i = 0; i < quranN.length && hits.length < 60; i++) if (quranN[i].includes(q)) hits.push(i);
    let total = hits.length;
    if (total === 60) { total = 0; quranN.forEach(t => { if (t.includes(q)) total++; }); }
    if (hits.length) html += `<div class="res-head">الآيات (${ar(total)}${total > hits.length ? "، أول " + ar(hits.length) : ""})</div>` + hits.map(i => {
      const o = AY[i];
      return `<button class="res" data-i="${i}"><span class="rr">${SURAHS[o.s - 1][0]} ${ar(o.a)}</span><span class="rt">${markIn(QURAN[o.s - 1][o.a - 1], q)}</span></button>`;
    }).join("");
  } else if (q.length >= 2 && !quranN) {
    html += `<div class="res-empty">جارٍ تحميل نص القرآن…</div>`;
    loadQuran().then(runSearch, () => showResults(`<div class="res-empty">تعذّر تحميل نص القرآن للبحث.</div>`));
  }
  showResults(html || `<div class="res-empty">لا توجد نتائج</div>`);
}
let sT;
sIn.addEventListener("focus", () => { loadQuran().catch(() => {}); if (sIn.value.trim()) runSearch(); });
sIn.addEventListener("input", () => { clearTimeout(sT); sT = setTimeout(runSearch, 150); });
sIn.addEventListener("keydown", e => {
  if (e.key === "Escape") { sBox.hidden = true; sIn.blur(); return; }
  if (!sItems.length || sBox.hidden) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    sOn = (sOn + (e.key === "ArrowDown" ? 1 : -1) + sItems.length) % sItems.length;
    sItems.forEach((b, k) => b.classList.toggle("on", k === sOn));
    sItems[sOn].scrollIntoView({ block: "nearest" });
  } else if (e.key === "Enter") {
    e.preventDefault();
    goTo(+sItems[Math.max(0, sOn)].dataset.i);
  }
});
sBox.addEventListener("click", e => { const b = e.target.closest(".res"); if (b) goTo(+b.dataset.i); });
sIn.addEventListener("search", () => { if (!sIn.value.trim()) sBox.hidden = true; });
document.addEventListener("click", e => { if (!$("searchBox").contains(e.target)) sBox.hidden = true; });

/* ---------- Start ---------- */
function parseRef(str) {
  const m = /(\d{1,3})[_:-](\d{1,3})/.exec(str || "");
  return m ? idxOf(+m[1], +m[2]) : -1;
}
fill();
setPlayBtn();
let start = parseRef(location.hash);
if (start < 0) start = idxOf(1, 1);
render(X().pageOf[start]);
select(start);
</script>
