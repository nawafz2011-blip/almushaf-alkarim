<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f5e5b">
<title>المصحف الكريم | تحت التحديث</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #f8f6f0; color: #444; font-family: "Noto Naskh Arabic", "Amiri", "Geeza Pro", "Segoe UI", Tahoma, serif;
         display: flex; align-items: center; justify-content: center; text-align: center; padding: 18px; box-sizing: border-box; }
  .frame { position: fixed; inset: 18px; border: 2px solid rgba(31, 94, 91, .2); border-radius: 22px; pointer-events: none; }
  img { width: 96px; height: 96px; border-radius: 22px; margin-bottom: 26px; }
  h1 { font-size: 30px; color: #1f5e5b; margin: 0 0 18px; }
  p { font-size: 21px; line-height: 1.9; margin: 0; }
  .d { width: 60px; height: 3px; background: #b08a3e; margin: 22px auto; border-radius: 2px; }
  @media (prefers-color-scheme: dark) {
    body { background: #19211f; color: #cfd8d5; }
    h1 { color: #8fc7c1; }
    .frame { border-color: rgba(143, 199, 193, .25); }
  }
</style>
</head>
<body>
<div class="frame"></div>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>المصحف الكريم</h1>
  <p>الموقع تحت التحديث حاليًا</p>
  <div class="d"></div>
  <p>نعود قريبًا بإذن الله</p>
</main>
</body>
</html>
